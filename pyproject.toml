[project]
name = "qwen35-cuda-reference"
version = "0.1.0"
description = "Python reference implementation for the Qwen3.5 CUDA project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel",
    "matplotlib",
    "pandas",
    "safetensors==0.8.0",
    "seaborn",
    "torch==2.7.0",
    "transformers==5.13.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
